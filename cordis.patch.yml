# dsh-unstuck bundle patch
#
# 装进 profile 之后，这一层会插入一个 dsh-unstuck 条目。
# 这里写的 config 只是「初始值」：真正的调参请改
#   <DSH_HOME>/unstuck/config.json
# 那个文件优先级更高，改完重启 dsh 生效（不用改本文件、不用重装）。
#
# 注意：dsh-purge 的 autoRetry 已经在做请求重试（profile 里默认开着）。
# 本插件 autoRetry 默认 false，避免两边叠成 6 次重试。
# 想统一交给监督员管，就在 profile 的 cordis.patch.yml 里把
# dsh-purge 的 autoRetry 关掉，再打开下面这个。

- insert:
    - id: dsh-unstuck
      name: 'dsh-unstuck'
      config:
        enabled: true
        verbose: false

        # 轮次异常结束 → 补一条「继续」
        autoContinue: true
        continueMax: 3
        continueText: "继续"
        continueDelayMs: 700
        backoffMs: [1500, 5000, 15000]

        # 「假完成」也续跑：turn/end 写着 completed，其实工具调用被中转站吞成正文，
        # agent 静默 idle —— 这是实测里最常见的断连形态（见 README 的「断连根因」）
        continueOnSwallowed: true
        continueTextSwallowed: "继续。你上一条消息里的工具调用没有正常发出，请直接重新发起工具调用，不要重复解释。"

        # 你按了停止（turn/end = aborted{kind:'user'}）怎么办：
        #   never  = 一律不碰（默认，你按停止就是停止）
        #   silent = 只在「这一轮一个字都没输出」时补一条
        #            （实测 8 次用户中断全是零输出，和「界面看着卡住我按一下」分不清）
        #   always = 只要不是监督员自己掐的都续（不建议）
        continueOnUserAbort: never
        notifyUserAbort: true

        # 「问了不等」：正文在等你点头，模型却自己往下干 → 掐掉这一轮，把发言权还给你
        #   off    = 不管
        #   mutate = 只有它开始动文件（write/edit/delete/apply_patch…）才掐（默认）
        #   any    = 问完只要还有下一步动作（含 shell）就掐
        pauseOnUnansweredQuestion: mutate

        # 正文里把话头交给你（「回「可以」我就开始」「三处需要你点头」）→ 绝不补「继续」。
        # 它没弹问题框、只在正文里让你确认/选择时，补一条「继续」等于替你把决定做了，
        # 你没空回，它已经自己开工了。实测案例见 lib/core.js 的 tailAsksForAnswer 注释 B。
        respectPendingQuestion: true

        # 模型请求重试（默认交给 dsh-purge）
        autoRetry: false
        retryMax: 2

        # 假死检测：请求发出后多久没有任何流片段就掐掉重来
        stallEnabled: true
        stallMs: 180000
        stallResumeMs: 800
        tickMs: 15000
        hardStallMs: 0

        # 卡在等审批 / 等回答时提醒
        notifyBlocked: true
        blockedNotifyMs: 120000

        # 通知命令，{msg} 会被替换成正文；留空则只写日志
        notifyCommand: ""

        # 子 agent 默认不插手
        skipOwnedAgents: true
